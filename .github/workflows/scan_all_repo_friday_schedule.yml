name: scan-all-repositories-friday

on:
  workflow_dispatch:
  # Automatic triggers are disabled. Uncomment to restore them.
  # schedule:
  #   - cron: '0 22 * * 5'
  # push:
  #   branches: [master]

permissions:
  contents: read

jobs:
  Pipeline:
    name: Install, discover, scan, report, and mail
    runs-on: ubuntu-latest
    steps:
      - name: Checkout commit
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install tools and discover repositories in parallel
        env:
          GH_TOKEN: ${{ secrets.ORGANIZATION_REPO_TOKEN }}
          GITHUB_ORG: ${{ vars.ORGANIZATION_NAME }}
        run: |
          set -uo pipefail
          mkdir -p installed-tools install-status repository
          tools=(checkov trivy semgrep gitleaks tflint kyverno terrascan)
          printf '%s\n' "${tools[@]}" >tool-names.txt

          for tool in "${tools[@]}"; do
            (
              set -o pipefail
              if bash scripts/install-security-tool.sh \
                "$tool" config/tool-versions.env "installed-tools/$tool" \
                2>&1 | tee "install-status/$tool.log"; then
                printf 'install_%s=success\n' "$tool" \
                  >"install-status/$tool.txt"
              else
                printf 'install_%s=failure\n' "$tool" \
                  >"install-status/$tool.txt"
              fi
            ) &
          done

          (
            if bash scripts/get-repository-list.sh \
              repository-names.txt \
              repository/exceptions \
              repository/discovered-repositories.yaml; then
              echo 'repository_discovery=success' \
                >repository-discovery-status.txt
            else
              touch repository-names.txt repository/discovered-repositories.yaml
              echo 'repository_discovery=failure' \
                >repository-discovery-status.txt
            fi
          ) &

          wait
          echo 'Installation results:'
          find install-status -type f -name '*.txt' -exec cat {} \; | sort
          echo
          echo 'Dynamic repository matrix:'
          if [[ -s repository-names.txt ]]; then
            cat repository-names.txt
          else
            echo '(none)'
          fi

      - name: Scan repository and tool combinations in parallel
        env:
          GH_TOKEN: ${{ secrets.ORGANIZATION_REPO_TOKEN }}
          GITHUB_ORG: ${{ vars.ORGANIZATION_NAME }}
        run: |
          set -uo pipefail
          mkdir -p scan-reports
          : >scan-combinations.txt
          while IFS= read -r repository; do
            [[ -z "$repository" ]] && continue
            while IFS= read -r tool; do
              [[ -z "$tool" ]] && continue
              printf '%s\t%s\n' "$tool" "$repository" \
                >>scan-combinations.txt
            done <tool-names.txt
          done <repository-names.txt

          parallelism="$(nproc)"
          echo "Running up to $parallelism scans in parallel."
          set +e
          xargs -r -P "$parallelism" -n 2 bash -c '
            tool="$1"
            repository="$2"
            repository_file="$(mktemp)"
            printf "%s\n" "$repository" >"$repository_file"
            echo "::group::Scan / $repository / $tool"
            bash scripts/scan-security-tool.sh \
              "$tool" "installed-tools/$tool" \
              "$repository_file" scan-reports
            result=$?
            echo "::endgroup::"
            rm -f "$repository_file"
            exit "$result"
          ' _ <scan-combinations.txt
          scan_exit=$?
          set -e
          if ((scan_exit == 0)); then
            echo 'scan_execution=success' >scan-execution-status.txt
          else
            echo 'scan_execution=failure' >scan-execution-status.txt
          fi

      - name: Install reporting dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            PyYAML==6.0.2 jsonschema==4.23.0

      - name: Generate consolidated report
        run: |
          set +e
          python scripts/generate_consolidated_report.py \
            --reports scan-reports \
            --output consolidated-reports
          report_exit=$?
          set -e
          if [[ -f consolidated-reports/organization-consolidated.html && \
                -f consolidated-reports/organization-consolidated.md ]]; then
            echo 'report_generation=success' \
              >consolidated-reports/report-status.txt
          else
            echo 'report_generation=failure' \
              >consolidated-reports/report-status.txt
          fi
          if ((report_exit == 0)); then
            echo 'security_gate=success' \
              >>consolidated-reports/report-status.txt
          else
            echo 'security_gate=failure' \
              >>consolidated-reports/report-status.txt
          fi

      - name: Record pipeline results
        if: always()
        run: |
          mkdir -p consolidated-reports install-status scan-reports
          {
            echo 'Organization DevSecOps pipeline status'
            echo
            find install-status -type f -name '*.txt' -exec cat {} \; | sort
            if [[ -f repository-discovery-status.txt ]]; then
              cat repository-discovery-status.txt
            else
              echo 'repository_discovery=failure'
            fi
            if [[ -f scan-execution-status.txt ]]; then
              cat scan-execution-status.txt
            else
              echo 'scan_execution=failure'
            fi
            if [[ -f consolidated-reports/report-status.txt ]]; then
              cat consolidated-reports/report-status.txt
            else
              echo 'report_generation=failure'
              echo 'security_gate=failure'
            fi
          } | tee consolidated-reports/pipeline-status.txt

      - name: Prepare email attachment
        id: package
        if: always()
        continue-on-error: true
        run: |
          mkdir -p consolidated-reports scan-reports install-status
          zip -qr organization-devsecops-reports.zip \
            consolidated-reports scan-reports install-status repository

      - name: Send consolidated report
        id: email
        if: always()
        continue-on-error: true
        env:
          MAIL_USERNAME: ${{ vars.MAIL_USERNAME }}
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
          SMTP_OAUTH2_TOKEN: ${{ secrets.SMTP_OAUTH2_TOKEN }}
          SMTP_SERVER: ${{ vars.SMTP_SERVER }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_SECURITY: ${{ vars.SMTP_SECURITY }}
          REPORT_TIMEZONE: ${{ vars.REPORT_TIMEZONE }}
        run: |
          python scripts/send_email_report.py \
            --attachment organization-devsecops-reports.zip \
            --recipient "${{ vars.MAIL_USERNAME }}" \
            --body-file consolidated-reports/pipeline-status.txt \
            --html-file consolidated-reports/organization-consolidated.html \
            --inline-image consolidated-reports/severity-pie.png \
            --inline-image consolidated-reports/repository-pie.png

      - name: Final pipeline gate
        if: always()
        env:
          PACKAGE_RESULT: ${{ steps.package.outcome }}
          EMAIL_RESULT: ${{ steps.email.outcome }}
        run: |
          {
            echo "report_packaging=$PACKAGE_RESULT"
            echo "email_delivery=$EMAIL_RESULT"
          } | tee -a consolidated-reports/pipeline-status.txt
          cat consolidated-reports/pipeline-status.txt
          if grep -Eq '=failure$|=cancelled$|=skipped$' \
            consolidated-reports/pipeline-status.txt; then
            exit 1
          fi

      - name: Publish consolidated report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: consolidated-security-report
          path: |
            consolidated-reports
            scan-reports
            install-status
            repository/discovered-repositories.yaml
            organization-devsecops-reports.zip
          retention-days: 30
