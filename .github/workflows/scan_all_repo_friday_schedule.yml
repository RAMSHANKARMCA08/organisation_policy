name: scan-all-repositories-friday

on:
  workflow_dispatch:
  # Automatic triggers are disabled. Uncomment to restore them.
  # schedule:
  #   - cron: '0 22 * * 5'
  # push:
  #   branches: [master]

permissions:
  contents: read

jobs:
  Install:
    name: Install / ${{ matrix.tool }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tool:
          - checkov
          - trivy
          - semgrep
          - gitleaks
          - tflint
          - kyverno
          - terrascan
    steps:
      - name: Checkout commit
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install ${{ matrix.tool }}
        id: install
        continue-on-error: true
        run: |
          mkdir -p install-status
          set -o pipefail
          bash scripts/install-security-tool.sh \
            "${{ matrix.tool }}" \
            config/tool-versions.env \
            "installed-tools/${{ matrix.tool }}" \
            2>&1 | tee "install-status/${{ matrix.tool }}.log"

      - name: Record installation result
        if: always()
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
        run: |
          mkdir -p install-status
          printf 'install_%s=%s\n' \
            "${{ matrix.tool }}" "$INSTALL_OUTCOME" \
            >"install-status/${{ matrix.tool }}.txt"

      - name: Publish installed tool
        if: steps.install.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: installed-tool-${{ matrix.tool }}
          path: installed-tools/${{ matrix.tool }}
          retention-days: 1

      - name: Publish installation result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: install-status-${{ matrix.tool }}
          path: install-status
          retention-days: 7

  Scan:
    name: Scan / ${{ matrix.tool }}
    needs: Install
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tool:
          - checkov
          - trivy
          - semgrep
          - gitleaks
          - tflint
          - kyverno
          - terrascan
    steps:
      - name: Checkout commit
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Download installed ${{ matrix.tool }}
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: installed-tool-${{ matrix.tool }}
          path: installed-tools/${{ matrix.tool }}

      - name: Select repositories from the approved inventory
        env:
          GH_TOKEN: ${{ secrets.ORGANIZATION_REPO_TOKEN }}
          GITHUB_ORG: ${{ vars.ORGANIZATION_NAME }}
        run: |
          bash scripts/get-repository-list.sh \
            repository-names.txt \
            repository/scan-exceptions.txt \
            repository/discovered-repositories.yaml

      - name: Scan repositories with ${{ matrix.tool }}
        id: scan
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.ORGANIZATION_REPO_TOKEN }}
          GITHUB_ORG: ${{ vars.ORGANIZATION_NAME }}
        run: |
          bash scripts/scan-security-tool.sh \
            "${{ matrix.tool }}" \
            "installed-tools/${{ matrix.tool }}" \
            repository-names.txt \
            scan-reports

      - name: Publish ${{ matrix.tool }} scan result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scan-result-${{ matrix.tool }}
          path: scan-reports
          retention-days: 30
          if-no-files-found: error

  ReportAndMail:
    name: Report and Mail / Consolidate and notify
    needs:
      - Install
      - Scan
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout commit
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install reporting dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            PyYAML==6.0.2 jsonschema==4.23.0

      - name: Download installation results
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: install-status-*
          path: install-status
          merge-multiple: true

      - name: Download scan results
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: scan-result-*
          path: scan-reports
          merge-multiple: true

      - name: Generate consolidated report
        id: report
        continue-on-error: true
        run: |
          python scripts/generate_consolidated_report.py \
            --reports scan-reports \
            --output consolidated-reports

      - name: Record pipeline results
        if: always()
        env:
          INSTALL_RESULT: ${{ needs.Install.result }}
          SCAN_RESULT: ${{ needs.Scan.result }}
          REPORT_RESULT: ${{ steps.report.outcome }}
        run: |
          mkdir -p consolidated-reports install-status scan-reports
          {
            echo "Organization DevSecOps pipeline status"
            echo
            echo "install_stage=$INSTALL_RESULT"
            find install-status -type f -name '*.txt' -exec cat {} \; | sort
            echo "scan_stage=$SCAN_RESULT"
            echo "report_stage=$REPORT_RESULT"
          } | tee consolidated-reports/pipeline-status.txt

      - name: Prepare email attachment
        id: package
        if: always()
        continue-on-error: true
        run: |
          mkdir -p consolidated-reports scan-reports install-status
          if [[ ! -f consolidated-reports/pipeline-status.txt ]]; then
            printf 'report_stage=failure\n' >consolidated-reports/pipeline-status.txt
          fi
          zip -qr organization-devsecops-reports.zip \
            consolidated-reports scan-reports install-status

      - name: Send consolidated report
        id: email
        if: always()
        continue-on-error: true
        env:
          MAIL_USERNAME: ${{ vars.MAIL_USERNAME }}
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
          SMTP_OAUTH2_TOKEN: ${{ secrets.SMTP_OAUTH2_TOKEN }}
          SMTP_SERVER: ${{ vars.SMTP_SERVER }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_SECURITY: ${{ vars.SMTP_SECURITY }}
        run: |
          python scripts/send_email_report.py \
            --attachment organization-devsecops-reports.zip \
            --recipient "${{ vars.MAIL_USERNAME }}" \
            --subject "Organization DevSecOps scan report" \
            --body-file consolidated-reports/pipeline-status.txt \
            --html-file consolidated-reports/organization-consolidated.html

      - name: Final pipeline gate
        if: always()
        env:
          REPORT_RESULT: ${{ steps.report.outcome }}
          PACKAGE_RESULT: ${{ steps.package.outcome }}
          EMAIL_RESULT: ${{ steps.email.outcome }}
        run: |
          {
            echo "report_generation=$REPORT_RESULT"
            echo "report_packaging=$PACKAGE_RESULT"
            echo "email_delivery=$EMAIL_RESULT"
          } | tee -a consolidated-reports/pipeline-status.txt
          cat consolidated-reports/pipeline-status.txt
          if grep -Eq '=failure$|=cancelled$|=skipped$' \
            consolidated-reports/pipeline-status.txt; then
            exit 1
          fi

      - name: Publish consolidated report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: consolidated-security-report
          path: |
            consolidated-reports
            scan-reports
            install-status
            organization-devsecops-reports.zip
          retention-days: 30
