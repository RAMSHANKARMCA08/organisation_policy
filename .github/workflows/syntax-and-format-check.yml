name: syntax-and-format-check

on:
  workflow_dispatch:
  # Automatic triggers are disabled. Uncomment to restore them.
  # push:
  # pull_request:

permissions:
  contents: read

jobs:
  python-validation:
    name: Python syntax and formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout commit
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Ruff
        run: python -m pip install --disable-pip-version-check ruff
      - name: Validate Python syntax
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find . -type f -name '*.py' -not -path './.git/*')
          if ((${#files[@]})); then
            python -m compileall -q "${files[@]}"
            ruff check --select E9,F "${files[@]}"
          else
            echo 'No Python files detected.'
          fi
      - name: Check Python formatting
        run: ruff format --check --diff .

  yaml-validation:
    name: YAML syntax and structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout commit
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install yamllint
        run: python -m pip install --disable-pip-version-check yamllint
      - name: Validate YAML syntax
        shell: bash
        run: |
          set -euo pipefail
          # Helm templates contain Go-template expressions and must be validated
          # after rendering rather than parsed as standalone YAML.
          mapfile -t files < <(find . -type f \( -name '*.yml' -o -name '*.yaml' \) \
            -not -path './.git/*' \
            -not -path './helm_chart/templates/*')
          if ((${#files[@]})); then
            yamllint -c .yamllint "${files[@]}"
          else
            echo 'No YAML files detected.'
          fi

  shell-validation:
    name: Shell syntax and formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout commit
        uses: actions/checkout@v5
      - name: Install shell tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck shfmt
      - name: Validate shell syntax
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find . -type f \( -name '*.sh' -o -name '*.bash' \) -not -path './.git/*')
          if ((${#files[@]})); then
            for file in "${files[@]}"; do
              bash -n "$file"
            done
            shellcheck --severity=warning "${files[@]}"
          else
            echo 'No shell files detected.'
          fi
      - name: Check shell formatting
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find . -type f \( -name '*.sh' -o -name '*.bash' \) -not -path './.git/*')
          if ((${#files[@]})); then
            shfmt -d -i 2 -ci "${files[@]}"
          else
            echo 'No shell files detected.'
          fi

  policy-governance:
    name: Policy governance and release gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout commit
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install governance dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            PyYAML==6.0.2 jsonschema==4.23.0
      - name: Validate policy IDs, exceptions, and severity gate
        run: python scripts/validate_security_controls.py
      - name: Validate policy governance and ownership
        run: python scripts/governance_check.py

  security-scan:
    name: Secret and infrastructure scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout commit
        uses: actions/checkout@v5
      - name: Load approved tool versions
        run: grep -E '^[A-Za-z_][A-Za-z0-9_]*=.*$' config/tool-versions.env >> "$GITHUB_ENV"
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Checkov
        run: |
          python -m pip install --disable-pip-version-check \
            "checkov==${CHECKOV_VERSION}"
      - name: Install Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o "$RUNNER_TEMP/gitleaks.tar.gz"
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" \
            -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          sudo install "$RUNNER_TEMP/gitleaks-bin/gitleaks" /usr/local/bin/gitleaks
      - name: Scan repository secrets
        run: |
          gitleaks detect --source . \
            --config gitleaks/config/gitleaks.toml \
            --no-banner
      - name: Scan infrastructure as code
        run: checkov -d . --quiet --skip-path 'helm_chart/templates'
