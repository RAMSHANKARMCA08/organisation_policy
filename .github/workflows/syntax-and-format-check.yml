name: syntax-and-format-check

on:
  workflow_dispatch:
  # Automatic triggers are disabled. Uncomment to restore them.
  # push:
  # pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout commit
        uses: actions/checkout@v4

      - name: Load approved tool versions
        run: grep -E '^[A-Za-z_][A-Za-z0-9_]*=.*$' config/tool-versions.env >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation tools
        shell: bash
        run: |
          set -uo pipefail

          install_python_tools() {
            # Python syntax, formatting, YAML, and infrastructure-as-code checks.
            python -m pip install --disable-pip-version-check \
              ruff yamllint "checkov==${CHECKOV_VERSION}"
          }

          install_shell_tools() {
            # Shell syntax and formatting checks.
            sudo apt-get update
            sudo apt-get install --yes shellcheck shfmt
          }

          install_gitleaks() {
            # Repository secret scanning.
            curl --fail --location --silent --show-error \
              "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
              -o "$RUNNER_TEMP/gitleaks.tar.gz"
            mkdir -p "$RUNNER_TEMP/gitleaks-bin"
            tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" \
              -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
            sudo install "$RUNNER_TEMP/gitleaks-bin/gitleaks" /usr/local/bin/gitleaks
          }

          install_python_tools & python_pid=$!
          install_shell_tools & shell_pid=$!
          install_gitleaks & gitleaks_pid=$!

          status=0
          wait "$python_pid" || status=1
          wait "$shell_pid" || status=1
          wait "$gitleaks_pid" || status=1
          exit "$status"

      - name: Validate Python syntax
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find . -type f -name '*.py' -not -path './.git/*')
          if ((${#files[@]})); then
            python -m compileall -q "${files[@]}"
            ruff check --select E9,F "${files[@]}"
          else
            echo 'No Python files detected.'
          fi

      - name: Check Python beautification without changing files
        shell: bash
        run: |
          set -euo pipefail
          ruff format --check --diff .

      - name: Validate YAML syntax
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find . -type f \( -name '*.yml' -o -name '*.yaml' \) -not -path './.git/*')
          if ((${#files[@]})); then
            yamllint -d relaxed "${files[@]}"
          else
            echo 'No YAML files detected.'
          fi

      - name: Validate shell syntax
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find . -type f \( -name '*.sh' -o -name '*.bash' \) -not -path './.git/*')
          if ((${#files[@]})); then
            for file in "${files[@]}"; do
              bash -n "$file"
            done
            shellcheck --severity=warning "${files[@]}"
          else
            echo 'No shell files detected.'
          fi

      - name: Check shell beautification without changing files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find . -type f \( -name '*.sh' -o -name '*.bash' \) -not -path './.git/*')
          if ((${#files[@]})); then
            shfmt -d -i 2 -ci "${files[@]}"
          else
            echo 'No shell files detected.'
          fi

      - name: Validate policy IDs, exceptions, and severity gate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_security_controls.py

      - name: Validate policy governance and ownership
        shell: bash
        run: |
          set -euo pipefail
          python scripts/governance_check.py

      - name: Scan repository secrets and IaC
        shell: bash
        run: |
          set -euo pipefail
          gitleaks detect --source . --config gitleaks/config/gitleaks.toml --no-banner
          checkov -d . --quiet

