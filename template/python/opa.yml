trigger: none
pr: none

variables:
  reportDirectory: '$(Build.ArtifactStagingDirectory)/python-reports'

stages:
- stage: InstallScanners
  jobs:
  - job: Install
    pool: { vmImage: ubuntu-latest }
    steps:
    - task: UsePythonVersion@0
      inputs: { versionSpec: '3.12' }
    - bash: |
        set -euo pipefail
        # Semgrep: scan Python source with SAST and organization rules.
        python -m pip install --target "$(Build.ArtifactStagingDirectory)/python-tools" semgrep bandit pip-audit
    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)/python-tools'
        ArtifactName: scanner-bundle
        publishLocation: Container

- stage: RunScanners
  dependsOn: InstallScanners
  jobs:
  - job: Scan
    pool: { vmImage: ubuntu-latest }
    steps:
    - checkout: self
    - task: UsePythonVersion@0
      inputs: { versionSpec: '3.12' }
    - task: DownloadBuildArtifacts@1
      inputs: { buildType: current, downloadType: single, artifactName: scanner-bundle, downloadPath: '$(Pipeline.Workspace)' }
    - bash: |
        set -Eeuo pipefail
        export PATH="$(Pipeline.Workspace)/scanner-bundle/bin:$PATH"
        export PYTHONPATH="$(Pipeline.Workspace)/scanner-bundle"
        mkdir -p "$(reportDirectory)"
        if find "$(Build.SourcesDirectory)" -type f -name '*.py' -print -quit | grep -q .; then
          # Semgrep: emit machine-readable Python SAST findings.
          python3 -m semgrep scan --config semgrep/python --config semgrep/organization --json-output "$(reportDirectory)/semgrep.json" "$(Build.SourcesDirectory)"
          # Bandit: check Python-specific security weaknesses.
          python3 -m bandit -r "$(Build.SourcesDirectory)" -f json -o "$(reportDirectory)/bandit.json"
          # pip-audit: check Python dependency vulnerabilities.
          req="$(find "$(Build.SourcesDirectory)" -maxdepth 2 -type f -name 'requirements*.txt' -print -quit || true)"
          if [[ -n "$req" ]]; then python3 -m pip_audit -r "$req" --format json --output "$(reportDirectory)/pip-audit.json"; fi
        else
          echo '{"status":"not_applicable"}' > "$(reportDirectory)/python.json"
        fi
    - task: PublishBuildArtifacts@1
      condition: always()
      inputs: { PathtoPublish: '$(reportDirectory)', ArtifactName: python-scan-reports, publishLocation: Container }


