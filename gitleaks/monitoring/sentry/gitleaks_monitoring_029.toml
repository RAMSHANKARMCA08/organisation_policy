# policy id: gitleaks-monitoring-029
# reason: detect sentry dsn in repository content
# severity: critical

[[rules]]
id = "gitleaks-monitoring-029"
description = "Sentry DSN"
regex = '''https://[A-Za-z0-9]+:[A-Za-z0-9]+@o[0-9]+\.ingest\.sentry\.io'''
secretGroup = 0
keywords = ["sentry_dsn"]
tags = ["secret", "monitoring"]

