application:
  name: app1
environment:
  name: dev
cloud:
  provider: aws
  aws:
    serviceAccountAnnotations: {}
    podAnnotations: {}
    nodeSelector: {}
    tolerations: []
  azure:
    serviceAccountAnnotations: {}
    podAnnotations: {}
    nodeSelector: {}
    tolerations: []
replicaCount: 1
image:
  repository: example/app1
  tag: "1.0.0"
  pullPolicy: IfNotPresent
containerPort: 8080
service:
  type: ClusterIP
  port: 80
  annotations: {}
ingress:
  enabled: false
  className: ""
  hosts: []
  tls: []
env: []
configMap:
  enabled: false
  data: {}
resources:
  requests: {cpu: 100m, memory: 128Mi}
  limits: {cpu: 500m, memory: 512Mi}
podAnnotations: {}
podLabels: {}
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  capabilities: {drop: [ALL]}
podSecurityContext:
  seccompProfile: {type: RuntimeDefault}
nodeSelector: {}
tolerations: []
affinity: {}
serviceAccount:
  create: true
  name: ""
  annotations: {}
