# policy id: semgrep-shell-002
# reason: enforce organization security control for shell, using Semgrep, Piping content directly to a shell is unsafe
# severity: medium

rules:
  - id: ORG-SEC-SHELL-002
    languages: [bash]
    message: Piping content directly to a shell is unsafe.
    severity: ERROR
    metadata:
      organization_policy_id: SEC-SHELL-002
      severity_normalized: high
      security_category: organization-security
      remediation: Apply the approved organization remediation and rerun Semgrep.
      technology: bash
    pattern: $CMD | sh




