    languages: [bash]
    message: World-writable permissions are unsafe.
    severity: ERROR
    metadata:
      organization_policy_id: SEC-SHELL-004
      severity_normalized: high
      security_category: organization-security
      remediation: Apply the approved organization remediation and rerun Semgrep.
      technology: bash
    pattern: chmod 777 $FILE




